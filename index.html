【核心试用执行规程】

## 1. 任务与交互
帮助霍桑语言班客户完成与自己专业相关的Task2研究论文，支持三个入口：从专业选题、接续已有工作、修改初稿。

- 每次只问影响当前工作的必要问题。专业过宽或题目不清楚时，先用通俗解释帮助客户判断。
- 用中文解释选择、研究发现和修改理由；论文正文使用英文。
- 默认从专业提出约3个可比较的题目，说明核心想法、专业关联、类型、具体应用线索、资料条件和写作难点。
- 选题需要客户选择或反馈。客户已授权继续的阶段，直接推进，不重复请求同一确认。
- 对来源不足或尚未确认的事实，记录缺口，继续完成不依赖该缺口的工作。
- 只有实际搜索、打开或读取成功，才报告相应操作已完成。工具限制、研究资料不足与写作方法的问题分别说明。
- 本文件没有附三篇例文或完整评分表，不声称已经读取它们。对论文的自查结果不能当作学校成绩或通过保证。

## 2. 选题与内容的共同要求
研究一个对客户专业产生显著改变或拓展的想法。可选择theory、new direction或technological innovation，按文章解释重心判断，不要求三个候选分别占一种类型。
论文需要解释想法，介绍2–3个具体应用及结果，并评价收益、主要受益者、局限和挑战。所有实质信息、观点和评价都需要可靠研究支持与恰当引用。
一个可写题目应当具备：
1. 清楚的核心想法与专业关联。
2. 能解释它改变或拓展了此前方法的哪个方面。
3. 至少两个可以核查的具体应用。
4. 能研究收益及局限，而非只有推广式介绍。
5. 有机会找到符合文献规则、实际支持文章的来源。
新方向可以发生在已有流程的一个环节，不要求从无到有。需要说明具体变化及其意义。不要把“大领域名称”或泛泛用途当作已经找到具体案例。

## 3. 三种类型分别解释什么
### New direction
- 交代必要的专业背景。
- 说明为什么需要这个方向、什么促成它出现。
- 解释它是什么、怎样工作。
- 对照之前的流程，说明哪里发生变化。
- 应用写清怎样、在哪里、何时实施，以及结果。
### Theory
- 交代必要背景及促成理论出现的问题。
- 核对谁在何时提出；文献出版年份不能直接当成理论提出年份。
- 历史只保留帮助理解的部分。
- 解释理论主张、它解释现实中的什么现象／问题／规律，以及内部关系如何发挥作用。
- 用具体应用及结果展示理论的作用。
### Technological innovation
- 从实际需求或问题解释创新出现的背景。
- 说明此前方法的具体不足，并据证据判断不足的程度。
- 解释创新是什么、主要部件或步骤如何工作、与之前的做法有何差异。
- 应用要有具体地点或项目名称，说明实施方式及结果。
三种类型的Evaluation都检查收益、受益者、局限和挑战。原理、案例和评价的专业范围必须与Introduction中的承诺一致。

## 4. 篇幅、结构与语言
- 本科：目标1500个英文单词，范围1350–1650
- 研究生：目标2000个英文单词，范围1800–2200
- 五部分：Introduction、Explanation、Applications、Evaluation、Conclusion
- 主体衔接：Explanation、Applications、Evaluation之间要有过渡句或过渡段
- 自然段：每段有中心句，围绕一个中心展开；改变中心时另起一段
- 段落篇幅：“约300个英文单词”作为参考；主体各部分可以包含多个自然段
- 语言目标：清楚、准确、适当学术化，整体参考IELTS 6.5–7的语言难度
- 术语：保留必要的专业术语，首次出现时简短解释；用常见词清楚表达逻辑，保持语法正确

## 5. 文献与引用
至少10篇不同且在正文实际使用的文献，是本项目的教学强化要求；“10篇”指文献数量。来源必须为英文、在实际写作日期之前20年内，并至少包含一本书和一篇期刊论文。
- 核对作者、年份、题名、来源类型及可查地址／DOI。
- 为每条拟用来源记录：实际读取到标题、摘要还是相关正文；支持哪个观点；关键结论的原文位置与适用条件。
- 同一论文的出版社版、数据库记录和作者预印本不重复计数；同一本书的多个章节在本轮按一本计数。
- 文内引文和文末References都按墨大APA7指南核对：https://library.unimelb.edu.au/recite/referencing-styles/apa7
- 正文与References相互对应；实际未使用的资料不计入10篇有效来源。

## 6. 分步执行
- 第一步选题：根据专业与学历提出约3个候选，交付选题比较表。
- 第二步研究与证据：围绕题目研究原理、2–3个具体应用、收益与局限，建立来源表。
- 第三步大纲：交付五部分的大纲、各段中心、拟用案例和证据、篇幅预算及待解决问题。
- 第四步初稿：按已核实证据形成完整英文初稿。
- 第五步修改：依据客户反馈先修改内容、结构和证据，再修改引用及语言。
- 第六步交付自查：逐项进行严谨核对并输出报告。

              <div class="space-y-3">
                <div class="p-3 bg-slate-800/50 border border-slate-700/50 rounded-xl">
                  <div class="text-xs text-slate-400 mb-1">当前登录学生</div>
                  <div class="text-sm font-medium text-emerald-400 truncate">{userEmail}</div>
                </div>

                <div class="p-3 bg-slate-800/30 border border-slate-800 rounded-xl text-xs text-slate-400 space-y-2">
                  <div class="font-semibold text-slate-300">💡 试用规范绑定状态:</div>
                  <div class="flex items-center gap-2">
                    <span class={`w-2 h-2 rounded-full ${apiKey ? 'bg-emerald-400' : 'bg-amber-400'}`}></span>
                    <span>引擎: {apiKey ? 'GPT-4o 算力已绑定' : '未配置 API Key'}</span>
                  </div>
                  <div>• 规范支持: 墨大 APA7 引用</div>
                  <div>• 文献指标: 至少20篇英文来源</div>
                  <div>• 篇幅标准: 本科1500字 / 研究生2000字</div>
                </div>
              </div>
            </div>

            <button 
              onClick={() => {
                setIsAuthenticated(false);
                setViewState('landing');
              }}
              class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-medium border border-slate-700 transition"
            >
              退出登录
            </button>
          </div>

          <div class="flex-1 flex flex-col h-full bg-slate-950 relative">
            <header class="h-16 border-b border-slate-800 bg-slate-900/50 backdrop-blur px-6 flex items-center justify-between">
              <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-sm font-semibold text-slate-200">Task2 试用说明规程执行中</span>
              </div>
              <button 
                onClick={() => setShowStateCard(!showStateCard)}
                class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs border border-slate-700 flex items-center gap-1.5"
              >
                {showStateCard ? '隐藏论文状态卡' : '查看论文状态卡'}
              </button>
            </header>

            <div class="flex-1 overflow-y-auto p-6 space-y-6">
              {messages.map((msg, idx) => (
                <div key={idx} class={`flex gap-4 max-w-3xl ${msg.role === 'user' ? 'ml-auto flex-row-reverse' : ''}`}>
                  <div class={`w-9 h-9 rounded-xl flex items-center justify-center font-bold text-xs shrink-0 ${
                    msg.role === 'user' ? 'bg-indigo-600 text-white' : 'bg-slate-800 border border-slate-700 text-indigo-400'
                  }`}>
                    {msg.role === 'user' ? '学生' : '导师'}
                  </div>
                  <div class={`p-4 rounded-2xl text-sm leading-relaxed whitespace-pre-wrap ${
                    msg.role === 'user' ? 'bg-indigo-600 text-white' : 'bg-slate-900 border border-slate-800 text-slate-200'
                  }`}>
                    {msg.content}
                  </div>
                </div>
              ))}
              {isGenerating && (
                <div class="flex gap-4 max-w-3xl">
                  <div class="w-9 h-9 rounded-xl bg-slate-800 border border-slate-700 text-indigo-400 flex items-center justify-center font-bold text-xs shrink-0">导师</div>
                  <div class="p-4 rounded-2xl bg-slate-900 border border-slate-800 text-slate-400 text-sm flex items-center gap-2">
                    <span class="w-2 h-2 bg-indigo-500 rounded-full animate-ping"></span> Task2 墨大学术导师深度推演中...
                  </div>
                </div>
              )}
              <div ref={messagesEndRef} />
            </div>

            <div class="p-4 border-t border-slate-800 bg-slate-900/40">
              <form onSubmit={handleSend} class="max-w-4xl mx-auto relative flex items-center">
                <input 
                  type="text"
                  placeholder="请输入您的专业、选题意向或论文需求..."
                  value={inputMsg}
                  onChange={(e) => setInputMsg(e.target.value)}
                  class="w-full bg-slate-900 border border-slate-700 rounded-2xl px-5 py-4 pr-14 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 text-sm shadow-inner"
                />
                <button 
                  type="submit"
                  disabled={!inputMsg.trim() || isGenerating}
                  class="absolute right-3 p-2.5 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white rounded-xl transition"
                >
                  发送
                </button>
              </form>
            </div>
          </div>

          {showStateCard && (
            <div class="w-80 bg-slate-900 border-l border-slate-800 p-5 hidden lg:block overflow-y-auto">
              <h3 class="text-sm font-bold text-slate-200 mb-4 pb-2 border-b border-slate-800 flex items-center gap-2">
                📋 Task2 论文进度状态卡
              </h3>
              <div class="space-y-4 text-xs">
                <div>
                  <span class="text-slate-400 block mb-1">专业与学历</span>
                  <div class="p-2.5 bg-slate-800/60 border border-slate-700/50 rounded-lg text-slate-200">待确认</div>
                </div>
                <div>
                  <span class="text-slate-400 block mb-1">论文题目与类型</span>
                  <div class="p-2.5 bg-slate-800/60 border border-slate-700/50 rounded-lg text-slate-200">选题对比阶段</div>
                </div>
                <div>
                  <span class="text-slate-400 block mb-1">当前推进阶段</span>
                  <div class="p-2.5 bg-indigo-950/40 border border-indigo-800/50 rounded-lg text-indigo-300 font-medium">1. 选题确认</div>
                </div>
                <div>
                  <span class="text-slate-400 block mb-1">有效文献核对进度</span>
                  <div class="p-2.5 bg-slate-800/60 border border-slate-700/50 rounded-lg text-slate-200">0 / 至少20篇</div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
